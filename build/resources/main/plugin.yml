name: BlockPhysics
description: "Block Physics Plugin: Disable physics and gravity for blocks."
prefix: BlockPhysics
version: '1.0-SNAPSHOT'

main: net.clanimg.blockPhysics.BlockPhysics
api-version: '1.21.11'
load: POSTWORLD

authors: [ WrobelXXL ]
website: https://clan-img.net

commands:
  physic:
    description: Schaltet die Blockphysik (Sand, Gravel, Beton usw.) in der aktuellen Welt an oder aus.
    usage: /physic <on|off>
    permission: blockphysics.toggle

permissions:
  blockphysics.toggle:
    description: Erlaubt das Ein-/Ausschalten der Blockphysik pro Welt.
    default: op
